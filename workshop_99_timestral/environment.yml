name: timestral_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - matplotlib>=3.8
  - statsmodels>=0.14
  - ipykernel>=6.29
  - jupyterlab>=4.0
  - pip:
    - torch>=2.4.0
    - torchvision>=0.19.0
    - safetensors>=0.4.0
    - huggingface_hub>=0.23.0
    - git+https://github.com/mistralai/timestral.git
