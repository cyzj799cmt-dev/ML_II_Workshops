[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-ii-workshops"
version = "0.1.0"
description = "Applied Machine Learning II Workshops (Lazarski University)"
authors = [
    {name = "Leonardo Di Caterina", email = "l.dicaterina@lazarski.pl"}
]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "umap-learn>=0.5.5",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "torch>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "nbformat>=5.9.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.29.0"
]

[tool.pytest.ini_options]
testpaths = ["workshop_00_revising/tests", "workshop_01_ts_graphics/tests", "workshop_02_decomposition/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"


[tool.setuptools]
packages = []
